[features]
multi_agent = true

[agents]
# This is a concurrency cap only.
# Parent-controller compliance is proven by 6 live registered child sessions on the coordination board,
# not by this setting alone.
max_threads = 6
max_depth = 1

[agents.planner]
config_file = ".codex/agents/planner.toml"

[agents.builder]
config_file = ".codex/agents/builder.toml"

[agents.qa]
config_file = ".codex/agents/qa.toml"

[agents.docs_sync]
config_file = ".codex/agents/docs_sync.toml"

[agents.evaluator]
config_file = ".codex/agents/evaluator.toml"

[agents.repo_mapper]
config_file = ".codex/agents/repo_mapper.toml"
