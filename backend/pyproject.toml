[project]
name = "freight-router-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "uvicorn[standard]>=0.52.4,<1.0",
  "httpx>=0.28.1,<1.0",
  "psutil>=7.0,<8.0",
  "pydantic>=2.13.5,<3.0",
  "pydantic-settings>=2.15.0,<3.0",
  "python-json-logger>=2.0.7,<3.0",
  "numpy>=2.1,<3.0",
  "scipy>=1.14,<2.0",
  "pandas>=2.2,<3.0",
  "networkx>=3.3,<4.0",
  "rasterio>=1.4,<2.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.7,<4.0",
  "rtree>=1.3,<2.0",
  "osmium>=3.7,<5.0",
  "ijson>=3.3,<4.0",
]

[project.scripts]
evaluation-run = "scripts.run_thesis_evaluation:main"
evaluation-lane = "scripts.run_thesis_lane:main"

[dependency-groups]
dev = [
  "pytest>=8.4.2,<9.0",
  "ruff>=0.16.5,<1.0",
  "pytest-benchmark>=5.2.3,<6.0",
  "statsmodels>=0.14,<1.0",
  "properscoring>=0.1,<1.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "thesis: legacy-named evaluation-results generation lane",
  "thesis_results: legacy-named evaluation result-lane and artifact-contract coverage",
  "thesis_modules: deterministic DCCS/REFC/VOI evaluation module coverage",
]
